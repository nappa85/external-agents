name: Test

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        # The oldest supported version and a current one.
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Lint
        run: |
          python -m pip install --quiet ruff==0.17.4
          ruff check .
          ruff format --check .
      - name: Shellcheck the installers
        run: shellcheck skills/external-agents/scripts/install/*.sh
      # The live sandbox tests need bwrap and skip without it.
      - name: Unit tests
        run: python -I -m unittest discover -s tests -v
